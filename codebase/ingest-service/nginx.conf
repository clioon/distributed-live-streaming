worker_processes auto;
rtmp_auto_push on;

events {}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            allow play 172.16.0.0/12;
            deny play all;
            notify_method post;
            on_publish http://ingest-callback:8000/callbacks/on-publish;
            on_publish_done http://ingest-callback:8000/callbacks/on-publish-done;
        }
    }
}

http {
    server {
        listen 8080;

        location = /health/live {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }
    }
}