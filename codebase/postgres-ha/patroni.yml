scope: streaming-postgres
namespace: /streaming/postgres/

restapi:
  listen: 0.0.0.0:8008

etcd3:
  protocol: http
  hosts:
    - etcd-1:2379
    - etcd-2:2379
    - etcd-3:2379
bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: true
    synchronous_mode_strict: true
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        synchronous_commit: remote_apply
        max_wal_senders: 10
        max_replication_slots: 10
        password_encryption: scram-sha-256
        ssl: "off"
  initdb:
    - encoding: UTF8
    - data-checksums

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data
  pgpass: /tmp/pgpass
  authentication:
    superuser:
      username: postgres
      password: postgres
    replication:
      username: replicator
      password: replicator
    rewind:
      username: rewind
      password: rewind
  parameters:
    unix_socket_directories: /var/run/postgresql
  pg_hba:
    - host replication replicator 0.0.0.0/0 trust
    - host streaming streaming_app 0.0.0.0/0 trust

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false