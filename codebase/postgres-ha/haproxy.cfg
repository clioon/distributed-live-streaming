global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend postgres_write
    bind *:5432
    default_backend postgres_primary

backend postgres_primary
    option tcp-check
    server primary postgres:5432 check inter 1s fall 2 rise 2
    server replica postgres-replica:5432 check inter 1s fall 2 rise 2 backup

frontend postgres_read
    bind *:5433
    default_backend postgres_replicas

backend postgres_replicas
    option tcp-check
    server replica postgres-replica:5432 check inter 1s fall 2 rise 2
    server primary postgres:5432 check inter 1s fall 2 rise 2 backup
